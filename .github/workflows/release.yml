name: Release

# Pushing a version tag (for example "1.0") builds the three platforms and creates a DRAFT
# release with every file and its SHA-256. Review the draft on GitHub and publish it by hand.
#
# Tag format: plain MAJOR.MINOR, no "v" prefix. The in-app update check of both editions parses
# /tag/([0-9]+\.[0-9]+) from the releases/latest redirect.
#
# The builds are not signed: macOS asks to confirm the first launch (right-click → Open) and
# Windows SmartScreen shows "More info → Run anyway". The README explains both.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild build \
            -project XDeck.xcodeproj \
            -scheme XDeck \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -destination "generic/platform=macOS" \
            MARKETING_VERSION="$GITHUB_REF_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Zip
        run: |
          APP=$(find "$RUNNER_TEMP/build/Build/Products/Release" -maxdepth 1 -name '*.app' | head -n 1)
          mkdir -p out
          ditto -c -k --keepParent "$APP" "out/XDeck-Multi-$GITHUB_REF_NAME-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # package.json holds MAJOR.MINOR.0; the tag sets MAJOR.MINOR.
      - name: Set the version from the tag
        shell: bash
        run: npm version "$GITHUB_REF_NAME.0" --no-git-tag-version --allow-same-version

      - run: npm run check

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
          if-no-files-found: error

  release:
    needs: [macos, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd files
          {
            echo "## Downloads"
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            for f in *; do
              echo "| \`$f\` | \`$(sha256sum "$f" | cut -d ' ' -f 1)\` |"
            done
          } > ../notes.md
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "XDeck Multi $GITHUB_REF_NAME" \
            --notes-file ../notes.md \
            --generate-notes \
            --draft
